<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8faf8"><title>小黑政治理论</title><link rel="stylesheet" href="style.css"></head>
<body><div class="shell">
  <aside class="sidebar"><div class="brand"><span class="brand-mark">黑</span><strong>小黑政治理论</strong></div><nav aria-label="主导航"><button class="nav active" data-view="path"><span>◈</span> 闯关</button><button class="nav" data-view="notes"><span>▤</span> 笔记 <i id="noteBadge"></i></button></nav><div class="side-foot"><div class="stat"><span>已掌握</span><strong id="masteredCount">0</strong></div><div class="stat"><span>已记录</span><strong id="savedCount">0</strong></div></div></aside>
  <main id="main"><div id="pathView" class="view"><header class="topbar"><div><span id="pathModeLabel" class="eyebrow">背题模式</span><h1>学习路径</h1></div><div class="top-actions"><button id="soundToggle" class="sound-toggle" aria-label="关闭音效" aria-pressed="true">♫</button><div class="progress-pill"><span class="progress-icon">✦</span><span id="totalProgress">0 / 0</span></div></div></header><div class="mode-switch" role="group" aria-label="学习模式"><button id="memorizeMode" class="active" aria-pressed="true">背题</button><button id="practiceMode" aria-pressed="false">刷题</button></div><section id="dailyTask" class="daily-task" aria-label="今日任务"></section><div class="content-grid"><section id="pathContent" class="path-content"></section><aside class="right-rail"><div class="rail-card"><div class="rail-icon">✦</div><div><span class="small-label">学习进度</span><strong id="railProgress">0%</strong></div><div class="rail-progress"><span id="railBar"></span></div></div><div class="rail-card compact"><span class="small-label">考前笔记</span><strong id="railNotes">0 个知识点</strong><button id="openNotes" class="text-link">查看笔记</button></div></aside></div></div>
  <div id="lessonView" class="view hidden"><header class="lesson-top"><button id="backPath" class="icon-button" aria-label="返回学习路径">×</button><div class="lesson-progress"><span id="lessonBar"></span></div><span id="lessonCounter">0 / 0</span></header><div class="lesson-wrap"><div class="lesson-meta" id="lessonMeta"></div><h1 id="lessonTitle"></h1><div id="introPanel" class="intro-panel"><div class="intro-head"><span class="eyebrow">本关内容</span><button id="savePointIntro" class="save-button">加入笔记</button></div><div id="theoryContent" class="theory-content"></div><div class="answer-preview"><h2>带答案的题目</h2><div id="previewQuestions"></div></div><button id="startQuestions" class="primary-button">开始闯关</button></div><div id="quizPanel" class="quiz-panel hidden"><div id="redoNotice" class="redo-notice hidden">以下是错题重做</div><div class="question-head"><span id="questionNumber" class="eyebrow"></span><button id="savePointQuiz" class="save-button">加入笔记</button></div><h2 id="questionText"></h2><div class="choices"><button class="choice" data-answer="true"><span>✓</span> 正确</button><button class="choice" data-answer="false"><span>×</span> 错误</button></div><div id="feedback" class="feedback hidden"></div><button id="nextQuestion" class="primary-button hidden">继续</button></div><div id="donePanel" class="done-panel hidden"><div class="done-medal">✦</div><span class="eyebrow">本关完成</span><h2 id="doneTitle"></h2><p id="doneStats"></p><div class="done-actions"><button id="retryLesson" class="secondary-button">再练一次</button><button id="finishLesson" class="primary-button">返回学习路径</button></div></div></div></div>
  <div id="notesView" class="view hidden"><header class="topbar"><div><span class="eyebrow">考前回看</span><h1>我的笔记</h1></div><button id="printNotes" class="outline-button">打印 / 存为 PDF</button></header><div id="notesContent" class="notes-content"></div></div>
  </main><button id="selectionSave" class="selection-save hidden">加入笔记</button><nav class="mobile-nav" aria-label="底部导航"><button data-view="path" class="active">◈<span>闯关</span></button><button data-view="notes">▤<span>笔记</span></button></nav></div><script src="app.js"></script></body></html>
